<!--
================================================================================
  GRANDVIEW MAINTENANCE SCHEDULE
  Auto-rolling weekly display for OptiSigns / shop-floor TV.
  Designed for 1920 × 1080 (1080p). Auto-scales to any 16:9 viewport.
================================================================================

  HOW TO HOST ON GITHUB PAGES  (≈5 min)
  -------------------------------------
  1. github.com → new PUBLIC repo, e.g. "maintenance-schedule".
  2. Add file → Upload files → drag this file in (keep name exactly
     "index.html"), commit to main.
  3. Repo → Settings → Pages.
       Source: "Deploy from a branch"
       Branch: main  /  folder: "/ (root)"  → Save.
  4. Wait ~60 sec. URL: https://<your-username>.github.io/maintenance-schedule/

  OPTISIGNS WEBSITE APP SETTINGS (42" 1080p TV)
  ---------------------------------------------
     URL:            https://<your-username>.github.io/maintenance-schedule/
     Refresh Rate:   Every 60 minutes  (page also self-rolls at midnight)
     Zoom:           100%    (leave at default — the page scales itself)
     Fit to Screen:  ON      (or "Stretch" / "Fill screen")
     Disable Scroll: YES
  The page measures whatever viewport OptiSigns gives it and auto-scales
  the 1920×1080 canvas to fit, preserving 16:9.

  TESTING A FUTURE WEEK
  ---------------------
  Append ?date=YYYY-MM-DD, e.g.  https://.../?date=2026-07-15

  ============================================================================
  TWO SCHEDULE FORMATS (important)
  ----------------------------------------------------------------------------
  This page renders TWO layouts depending on the week:

  • LEGACY week (the final old-schedule week, Jun 1–7 2026):
      - 3 rows: Day-Only / Day / Night
      - Old crew + old team colors
      - "Prosser" tags shown, and a single Prosser person auto-pairs with
        their old teammate (Kyle↔Alex, Collin↔Leo, Brad↔Bob, Martin↔Gabriel).
      - A week is treated as legacy automatically when its `shifts` object
        contains a `dayOnly` key.

  • NEW week (Jun 8 2026 onward):
      - 2 rows: Day / Night
      - New crew + new team colors, everyone at Grandview
      - No Prosser logic; each cell lists both teammates explicitly.

  UPDATING THE SCHEDULE NEXT YEAR
  -------------------------------
  Scroll to:   /* === SCHEDULE DATA — edit yearly === */
  For ongoing weeks use the NEW shape (no dayOnly, no prosser):
    {
      "start":  "YYYY-MM-DD",          // Monday
      "end":    "YYYY-MM-DD",          // Sunday
      "banner": null | "MECHANICS",    // "MECHANICS" = day/night switch week
      "shifts": {
        "day":   [ [cell0],...[cell6] ],   // Mon..Sun
        "night": [ [cell0],...[cell6] ]
      }
    }
  Each cell is an array of { "name": "Full Name" }.

  SWITCH / TRANSITION BANNERS
  ---------------------------
  • A week with banner "MECHANICS" shows "MECHANICS DAY/NIGHT SWITCH THIS WEEK"
    when it is the current week, and "...NEXT WEEK" on the prior week's
    Next-Week panel.
  • When the current week is the legacy week and the following week is on the
    new format, the Next-Week panel also shows a "NEW SCHEDULE IN EFFECT" tag.

  SCHEDULED DOWN DAYS
  -------------------
  Scroll to:   /* === DOWN DAYS === */  Add ISO dates (YYYY-MM-DD) to the set.
  Currently empty.

  Supported names (case-sensitive):
     NEW crew:    Kyle F. / Link B.   Alex G. / Jason W.
                  Martin Z. / Leo G.  Noe M. / Gabriel Z.
     LEGACY only: Collin H., Brad P., Bob W.  (used only in the Jun 1–7 week)
================================================================================
-->

<style>
  :root {
    /* Team colors — deeper industrial workshop palette */
    --blue:   #3A7A98;
    --orange: #B06730;
    --green:  #4E8046;
    --yellow: #A58522;
    --purple: #7A4E84;
    --red:    #9B3E32;

    /* Neutral industrial palette */
    --bg:         #EBE8DD;   /* warm stone */
    --surface:    #F4F2EB;
    --panel:      #E3DFD1;
    --border:     #C9C4B2;
    --ink:        #1A1915;
    --ink-sub:    #504D44;
    --ink-dim:    #8C887C;
    --accent:     #B54B28;   /* deep terracotta */
    --on-cell:    #F4F2EB;   /* text on colored cells */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #D9D4C3;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  html, body { background: var(--bg); }
  body { display: block; }

  /* Fixed 1920x1080 stage — positioned and scaled via JS. */
  .fit {
    position: fixed;
    inset: 0;
    background: var(--bg);
    overflow: hidden;
  }
  .scaler {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 0;
    left: 0;
    background: var(--bg);
    transform-origin: top left;
    overflow: hidden;
    transform: scale(1);
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  .stage {
    width: 100%;
    height: 100%;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    background: var(--bg);
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    padding-bottom: 4px;
  }
  .week-range {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 68px;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--ink);
    text-transform: uppercase;
  }
  .switch-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--on-cell);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .switch-chip.hidden { display: none; }
  .switch-chip .dot {
    width: 8px; height: 8px;
    background: var(--on-cell);
    display: inline-block;
  }

  /* ===== OOR BANNER ===== */
  .oor-banner {
    background: transparent;
    border: 1px solid var(--accent);
    border-left-width: 4px;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .oor-banner.hidden { display: none; }

  /* ===== MAIN GRID =====
     Default = NEW format (2 shift rows). .grid.legacy = 3 shift rows. */
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 120px repeat(7, 1fr);
    grid-template-rows: 84px 1fr 1fr;
    gap: 2px;
    background: var(--border);
    border: 2px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .grid.legacy {
    grid-template-rows: 84px 1fr 1fr 1fr;
  }

  .grid .corner { background: var(--surface); }

  .day-head {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    position: relative;
  }
  .day-head .dow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .day-head .dnum {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -1px;
  }
  .day-head.today {
    background: var(--accent);
  }
  .day-head.today .dow { color: var(--on-cell); opacity: 0.85; }
  .day-head.today .dnum { color: var(--on-cell); }

  .row-label {
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 8px;
  }
  .row-label .rl-main {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.1;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink-sub);
  }

  .cell {
    position: relative;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    justify-content: stretch;
    align-items: stretch;
    gap: 0;
    color: var(--on-cell);
    overflow: hidden;
  }
  .cell[data-color="blue"]   { background: var(--blue); }
  .cell[data-color="orange"] { background: var(--orange); }
  .cell[data-color="green"]  { background: var(--green); }
  .cell[data-color="yellow"] { background: var(--yellow); }
  .cell[data-color="purple"] { background: var(--purple); }
  .cell[data-color="red"]    { background: var(--red); }

  .cell[data-color=""]::before {
    content: "—";
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px; font-weight: 500;
  }

  /* Scheduled Down Day — full-cell treatment */
  .cell.down-cell {
    background: var(--panel);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 10px,
      rgba(26, 25, 21, 0.05) 10px 20px

    color: var(--ink-sub);
    justify-content: center;
    align-items: center;
  }
  .cell.down-cell::before { content: none; }

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
  }
  .cell.down-cell .down-top {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);

    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.3px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .person {

    align-items: center;
    justify-content: center;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }

  }
  .person .name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.02;
    letter-spacing: -0.3px;
    text-align: center;
    text-transform: uppercase;

    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

    font-size: 22px;
    letter-spacing: -0.5px;

    text-transform: uppercase;

    gap: 8px;
  }

    text-transform: uppercase;

    background: var(--bg);

    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;

    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .mini-cell.mrl {
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-sub);

  .mini-cell[data-color] {

    padding: 4px 0;

  .mini-cell[data-color="orange"] { background: var(--orange); }
  .mini-cell[data-color="green"]  { background: var(--green); }
  .mini-cell[data-color="yellow"] { background: var(--yellow); }
  .mini-cell[data-color="purple"] { background: var(--purple); }
  .mini-cell[data-color="red"]    { background: var(--red); }
  .mini-cell[data-color=""]       { background: var(--bg); color: var(--ink-dim); }

  .mini-cell.down-mini {
    background: var(--panel);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 6px,
      rgba(26, 25, 21, 0.06) 6px 12px
    );
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--ink-sub);
  }

  .mini-cell .ini-row {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .mini-cell .p-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    background: rgba(26, 25, 21, 0.82);
    color: var(--on-cell);
    padding: 2px 4px 2.5px;
    border-radius: 2px;
    line-height: 1;
  }
</style>
</head>

/* === AUTO-FIT TO VIEWPORT === */
function fitToViewport() {
  const scaler = document.getElementById('scaler');
  if (!scaler) return;
  const vw = window.innerWidth  || document.documentElement.clientWidth  || screen.width  || 1920;
  const vh = window.innerHeight || document.documentElement.clientHeight || screen.height || 1080;
  if (vw < 100 || vh < 100) return;
  const scale = Math.min(vw / 1920, vh / 1080);
  const scaledW = 1920 * scale;
  const scaledH = 1080 * scale;
  const left = (vw - scaledW) / 2;
  const top  = (vh - scaledH) / 2;
  scaler.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
}
fitToViewport();
window.addEventListener('resize', fitToViewport);
window.addEventListener('load', fitToViewport);
document.addEventListener('DOMContentLoaded', fitToViewport);
[100, 300, 600, 1000, 2000, 4000].forEach(function(ms) {
  setTimeout(fitToViewport, ms);
});

const DOW = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseISO(iso) { return new Date(iso + "T12:00:00"); }
function fmtDate(iso) {
  const d = parseISO(iso);
  return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
}
function isoForLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function getEffectiveDate() {
  const params = new URLSearchParams(location.search);
  const d = params.get("date");
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) return parseISO(d);
  return new Date();
}
function findWeekIndex(iso, weeks) {
  for (let i = 0; i < weeks.length; i++) {
    if (iso >= weeks[i].start && iso <= weeks[i].end) return { index: i, mode: "current" };
  }
  if (iso < weeks[0].start) return { index: 0, mode: "before" };
  return { index: weeks.length - 1, mode: "after" };
}

/* A week is "legacy" when it carries a Day-Only shift row. */
function isLegacyWeek(week) {
  return !!(week && week.shifts && week.shifts.dayOnly);
}

/* Per-week rendering context: which maps, which rows, whether to expand. */
function contextFor(week) {
  if (isLegacyWeek(week)) {
    return {
      legacy: true,
      colors: LEGACY_NAME_TO_COLOR,
      initials: LEGACY_NAME_TO_INITIALS,
      teammate: LEGACY_TEAMMATE,
      rows: [
        { key: "dayOnly", label: "Day-Only" },
        { key: "day",     label: "Day"      },
        { key: "night",   label: "Night"    }
      ]
    };
  }
  return {
    legacy: false,
    colors: NAME_TO_COLOR,
    initials: NAME_TO_INITIALS,
    teammate: null,
    rows: [
      { key: "day",   label: "Day"   },
      { key: "night", label: "Night" }
    ]
  };
}

/* Legacy weeks auto-pair a single Prosser person with their old teammate.
   New weeks already list both people, so just return the cell. */
function expandCell(cell, ctx) {
  if (!cell || cell.length === 0) return [];
  if (!ctx.legacy || !ctx.teammate) return cell.slice();
  const names = new Set(cell.map(p => p.name));
  const out = cell.slice();
  for (const p of cell) {
    if (p.prosser) {
      const mate = ctx.teammate[p.name];
      if (mate && !names.has(mate)) { out.push({ name: mate }); names.add(mate); }
    }
  }
  return out;
}
function colorOf(cell, ctx) {
  if (!cell || cell.length === 0) return "";
  return ctx.colors[cell[0].name] || "";
}

function renderDownCell(isToday) {
  const div = document.createElement("div");
  div.className = "cell down-cell";
  if (isToday) div.classList.add("today-col");
  const label = document.createElement("div");
  label.className = "down-label";
  label.innerHTML = '<span class="down-top">Scheduled</span><span class="down-bottom">Down Day</span>';
  div.appendChild(label);
  return div;
}

function renderCell(rawCell, isToday, ctx) {
  const cell = expandCell(rawCell, ctx);
  const div = document.createElement("div");
  div.className = "cell";
  if (isToday) div.classList.add("today-col");
  const color = colorOf(cell, ctx);
  div.dataset.color = color;
  if (!cell || cell.length === 0) return div;
  if (cell.length === 1) div.classList.add("one-person");
  for (const person of cell) {
    const row = document.createElement("div");
    row.className = "person";
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = person.name;
    row.appendChild(n);
    if (ctx.legacy && person.prosser) {
      const pill = document.createElement("div");
      pill.className = "prosser-tag";
      pill.textContent = "Prosser";
      row.appendChild(pill);
    }
    div.appendChild(row);
  }
  return div;
}

function renderDownMiniCell() {
  const div = document.createElement("div");
  div.className = "mini-cell down-mini";
  div.textContent = "DOWN";
  return div;
}

function renderMiniCell(rawCell, ctx) {
  const cell = expandCell(rawCell, ctx);
  const div = document.createElement("div");
  div.className = "mini-cell";
  const color = colorOf(cell, ctx);
  if (!color) {
    div.textContent = "–";
    return div;
  }
  div.dataset.color = color;
  for (const person of cell) {
    const row = document.createElement("div");
    row.className = "ini-row";
    const ini = document.createElement("span");
    ini.textContent = ctx.initials[person.name] || "";
    row.appendChild(ini);
    if (ctx.legacy && person.prosser) {
      const pm = document.createElement("span");
      pm.className = "p-mark";
      pm.textContent = "P";
      row.appendChild(pm);
    }
    div.appendChild(row);
  }
  return div;
}

function render() {
  const now = getEffectiveDate();
  const iso = isoForLocalDate(now);

  const weeks = SCHEDULE.weeks;
  const loc = findWeekIndex(iso, weeks);
  const oor = document.getElementById("oor-banner");
  if (loc.mode === "before") {
    oor.classList.remove("hidden");
    oor.textContent = "Schedule starts " + fmtDate(weeks[0].start) + " — showing first week";
  } else if (loc.mode === "after") {
    oor.classList.remove("hidden");
    oor.textContent = "Schedule ended " + fmtDate(weeks[weeks.length - 1].end) + " — update required";
  } else {
    oor.classList.add("hidden");
  }

  const week = weeks[loc.index];
  const nextWeek = weeks[loc.index + 1] || null;
  const ctx = contextFor(week);

  document.getElementById("week-range").textContent =
    fmtDate(week.start) + " — " + fmtDate(week.end);

  /* This-week banner: only the mechanic day/night switch is announced. */
  const chip = document.getElementById("switch-chip");
  const switchText = document.getElementById("switch-text");
  if (week.banner === "MECHANICS") {
    chip.classList.remove("hidden");
    switchText.textContent = "Mechanics Day/Night Switch This Week";
  } else {
    chip.classList.add("hidden");
  }

  let todayCol = -1;
  if (loc.mode === "current") {
    const start = parseISO(week.start);
    const diff = Math.round((now.setHours(12,0,0,0) - start.getTime()) / 86400000);
    if (diff >= 0 && diff <= 6) todayCol = diff;
  }

  const grid = document.getElementById("main-grid");
  grid.className = "grid" + (ctx.legacy ? " legacy" : "");
  grid.innerHTML = "";

  const corner = document.createElement("div");
  corner.className = "corner";
  grid.appendChild(corner);

  for (let i = 0; i < 7; i++) {
    const d = new Date(parseISO(week.start).getTime() + i * 86400000);
    const head = document.createElement("div");
    head.className = "day-head" + (i === todayCol ? " today" : "");
    head.innerHTML = `<div class="dow">${DOW[i]}</div><div class="dnum">${d.getDate()}</div>`;
    grid.appendChild(head);
  }

  for (const s of ctx.rows) {
    const rl = document.createElement("div");
    rl.className = "row-label";
    rl.innerHTML = `<div class="rl-main">${s.label}</div>`;
    grid.appendChild(rl);
    const row = week.shifts[s.key] || [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(parseISO(week.start).getTime() + i * 86400000);
      const dayIso = isoForLocalDate(d);
      if (DOWN_DAYS.has(dayIso)) {
        grid.appendChild(renderDownCell(i === todayCol));
      } else {
        grid.appendChild(renderCell(row[i] || [], i === todayCol, ctx));
      }
    }
  }

  /* ===== Next-week panel ===== */
  const nxt = document.getElementById("next-grid");
  const nxtRange = document.getElementById("next-range");
  const nxtSwitch = document.getElementById("next-switch");
  const nxtNewSched = document.getElementById("next-newsched");
  nxt.innerHTML = "";

  if (nextWeek) {
    const nctx = contextFor(nextWeek);
    nxtRange.textContent = fmtDate(nextWeek.start) + " — " + fmtDate(nextWeek.end);

    /* Mechanic day/night switch starting next week. */
    if (nextWeek.banner === "MECHANICS") {
      nxtSwitch.classList.remove("hidden");
      nxtSwitch.textContent = "Mechanics Day/Night Switch Next Week";
    } else {
      nxtSwitch.classList.add("hidden");
    }

    /* New schedule begins next week (current week is the final legacy week). */
    if (ctx.legacy && !nctx.legacy) {
      nxtNewSched.classList.remove("hidden");
    } else {
      nxtNewSched.classList.add("hidden");
    }

    nxt.className = "mini-grid" + (nctx.legacy ? " legacy" : "");

    const corner2 = document.createElement("div");
    corner2.className = "mini-cell mhead";
    nxt.appendChild(corner2);
    for (let i = 0; i < 7; i++) {
      const d = new Date(parseISO(nextWeek.start).getTime() + i * 86400000);
      const head = document.createElement("div");
      head.className = "mini-cell mhead";
      head.textContent = DOW[i] + " " + d.getDate();
      nxt.appendChild(head);
    }
    for (const s of nctx.rows) {
      const rl = document.createElement("div");
      rl.className = "mini-cell mrl";
      rl.textContent = s.label;
      nxt.appendChild(rl);
      const row = nextWeek.shifts[s.key] || [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(parseISO(nextWeek.start).getTime() + i * 86400000);
        const dayIso = isoForLocalDate(d);
        if (DOWN_DAYS.has(dayIso)) {
          nxt.appendChild(renderDownMiniCell());
        } else {
          nxt.appendChild(renderMiniCell(row[i] || [], nctx));
        }
      }
    }
  } else {
    nxtRange.textContent = "End of schedule";
    nxtSwitch.classList.add("hidden");
    nxtNewSched.classList.add("hidden");
    nxt.className = "mini-grid";
  }
}

render();
function scheduleMidnightRefresh() {
  const now = new Date();
  const t = new Date(now);
  t.setHours(24, 0, 30, 0);
  setTimeout(() => { render(); scheduleMidnightRefresh(); }, t - now);
}
scheduleMidnightRefresh();
setInterval(render, 60 * 60 * 1000);
</script>
</body>
</html>
