<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Maintenance Schedule</title>
<!--
================================================================================
  GRANDVIEW MAINTENANCE SCHEDULE
  Auto-rolling weekly display for OptiSigns / shop-floor TV.
  Designed for 1920 x 1080 (1080p). Auto-scales to any 16:9 viewport.
================================================================================

  HOW TO HOST ON GITHUB PAGES  (~5 min)
  -------------------------------------
  1. github.com -> new PUBLIC repo, e.g. "maintenance-schedule".
  2. Add file -> Upload files -> drag this file in (keep name exactly
     "index.html"), commit to main.
  3. Repo -> Settings -> Pages.
       Source: "Deploy from a branch"
       Branch: main  /  folder: "/ (root)"  -> Save.
  4. Wait ~60 sec. URL: https://YOUR-USERNAME.github.io/maintenance-schedule/

  OPTISIGNS WEBSITE APP SETTINGS (42" 1080p TV)
  ---------------------------------------------
     URL:            https://YOUR-USERNAME.github.io/maintenance-schedule/
     Refresh Rate:   Every 60 minutes  (page also self-rolls at midnight)
     Zoom:           100%    (leave at default - the page scales itself)
     Fit to Screen:  ON      (or "Stretch" / "Fill screen")
     Disable Scroll: YES

  TESTING A FUTURE WEEK
  ---------------------
  Append ?date=YYYY-MM-DD, e.g.  https://.../?date=2026-08-26

  SCHEDULE FORMATS
  ----------------
  - LEGACY week (final old-schedule week, Jun 1-7 2026): 3 rows
    (Day-Only / Day / Night), old crew, Prosser auto-pairing. A week is
    legacy when its shifts object contains a dayOnly key.
  - NEW weeks (Jun 8 2026 onward): 2 rows (Day / Night), everyone at
    Grandview, both teammates listed explicitly in each cell.
  - SPECIAL "downweek" (Aug 24-30 2026): custom row layout for the
    Aug 26-28 plant down days. It carries type: "downweek" and a "rows"
    array instead of "shifts"; each cell may span multiple day columns.
    Regular schedule resumes Sat Aug 29.

  ROSTER (as of Aug 2026)
  -----------------------
     Kyle F. / Link B.     (blue)
     Alex G. / Daniel C.   (green)
     Martin Z. / Leo G.    (orange)
     Jason W. / Gabriel Z. (yellow)
  Changes: Noe M. was replaced by Jason W. on the yellow team; Daniel C.
  took Jason W.'s old spot on the green team.
  LEGACY-only names (Jun 1-7 week): Collin H., Brad P., Bob W., Noe M.

  UPDATING THE SCHEDULE NEXT YEAR
  -------------------------------
  Scroll to:   /* === SCHEDULE DATA - edit yearly === */
  For ongoing weeks use the NEW shape:
    {
      "start":  "YYYY-MM-DD",          // Monday
      "end":    "YYYY-MM-DD",          // Sunday
      "banner": null | "MECHANICS",    // "MECHANICS" = day/night switch week
      "shifts": {
        "day":   [ [cell0],...[cell6] ],   // Mon..Sun
        "night": [ [cell0],...[cell6] ]
      }
    }
  Each cell is an array of { "name": "Full Name" }.

  SCHEDULED DOWN DAYS
  -------------------
  Scroll to:   /* === DOWN DAYS === */  Add ISO dates (YYYY-MM-DD) to the
  set for simple single-day "SCHEDULED DOWN DAY" overrides. (The Aug 26-28
  down days use the richer "downweek" layout instead.)
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Team colors - temporary-schedule jewel palette */
    --blue:   #44648C;
    --orange: #B4663C;
    --green:  #3E7B62;
    --yellow: #9C7E33;
    --purple: #6E5586;
    --red:    #A24E3F;

    /* Warm stone palette */
    --bg:         #E8E5DB;
    --surface:    #FFFFFF;
    --panel:      #F2EFE7;
    --border:     #DAD5C7;
    --ink:        #1A1915;
    --ink-sub:    #4A4843;
    --ink-dim:    #9A958C;
    --accent:     #D2562F;   /* terracotta */
    --on-cell:    #FFFFFF;   /* text on colored cells */
    --card:        linear-gradient(180deg, #FFFFFF 0%, #F7F5EE 100%);
    --shadow-card: 0 8px 20px rgba(26, 25, 21, 0.07);
    --shadow-cell: 0 12px 26px rgba(26, 25, 21, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #D9D4C3;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  html, body { background: var(--bg); }
  body { display: block; }

  /* Fixed 1920x1080 stage - positioned and scaled via JS. */
  .fit {
    position: fixed;
    inset: 0;
    background: var(--bg);
    overflow: hidden;
  }
  .scaler {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 0;
    left: 0;
    background: radial-gradient(132% 94% at 50% -16%, #F5F3EC 0%, #E8E5DB 62%);
    transform-origin: top left;
    overflow: hidden;
    transform: scale(1);
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  .stage {
    width: 100%;
    height: 100%;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: transparent;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    padding-bottom: 4px;
  }
  .week-range {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 70px;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--ink);
    text-transform: uppercase;
  }
  .switch-chip {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    padding: 13px 24px;
    background: var(--accent);
    color: var(--on-cell);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 14px 30px rgba(210, 86, 47, 0.30);
  }
  .switch-chip.hidden { display: none; }
  .switch-chip .dot {
    width: 11px; height: 11px;
    border-radius: 999px;
    background: var(--on-cell);
    display: inline-block;
  }

  /* ===== OOR BANNER ===== */
  .oor-banner {
    background: var(--accent);
    color: var(--on-cell);
    border-radius: 14px;
    padding: 12px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 14px 30px rgba(210, 86, 47, 0.28);
  }
  .oor-banner.hidden { display: none; }

  /* ===== MAIN GRID =====
     Default = NEW format (2 shift rows). .grid.legacy = 3 shift rows. */
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 150px repeat(7, 1fr);
    grid-template-rows: 104px 1fr 1fr;
    gap: 14px;
    background: transparent;
    border: none;
    overflow: visible;
  }
  .grid.legacy {
    grid-template-rows: 104px 1fr 1fr 1fr;
  }

  .grid .corner { background: transparent; }

  .day-head {
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 20px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    position: relative;
  }
  .day-head .dow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .day-head .dnum {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 46px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -1px;
  }
  .day-head.today {
    background: linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 46%), var(--accent);
    border-color: transparent;
    box-shadow: 0 14px 30px rgba(210, 86, 47, 0.30);
  }
  .day-head.today .dow { color: var(--on-cell); opacity: 0.85; }
  .day-head.today .dnum { color: var(--on-cell); }

  .row-label {
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 20px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 0 8px;
  }
  .row-label .rl-dot {
    width: 18px; height: 18px;
    border-radius: 999px;
    background: var(--ink-dim);
    box-shadow: 0 0 0 5px rgba(154, 149, 140, 0.16);
  }
  .row-label[data-shift="day"] .rl-dot {
    background: #B0821E;
    box-shadow: 0 0 0 5px rgba(176, 130, 30, 0.16);
  }
  .row-label[data-shift="night"] .rl-dot {
    background: #3C68C8;
    box-shadow: 0 0 0 5px rgba(60, 104, 200, 0.16);
  }
  .row-label[data-shift="dayOnly"] .rl-dot {
    background: var(--accent);
    box-shadow: 0 0 0 5px rgba(210, 86, 47, 0.16);
  }
  .row-label[data-dot="green"] .rl-dot {
    background: var(--green);
    box-shadow: 0 0 0 5px rgba(62, 123, 98, 0.16);
  }
  .row-label[data-dot="yellow"] .rl-dot {
    background: var(--yellow);
    box-shadow: 0 0 0 5px rgba(156, 126, 51, 0.16);
  }
  .row-label[data-dot="blue"] .rl-dot {
    background: var(--blue);
    box-shadow: 0 0 0 5px rgba(68, 100, 140, 0.16);
  }
  .row-label .rl-main {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ink);
  }
  .row-label .rl-sub {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: -6px;
  }

  .cell {
    position: relative;
    padding: 16px 18px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 12px;
    color: var(--on-cell);
    overflow: hidden;
    box-shadow: var(--shadow-cell);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%);
  }
  .cell[data-color="blue"]   { background-color: var(--blue); }
  .cell[data-color="orange"] { background-color: var(--orange); }
  .cell[data-color="green"]  { background-color: var(--green); }
  .cell[data-color="yellow"] { background-color: var(--yellow); }
  .cell[data-color="purple"] { background-color: var(--purple); }
  .cell[data-color="red"]    { background-color: var(--red); }
  .cell[data-color=""]       { background-image: none; background: var(--card); color: #B5B09F; border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--shadow-card); }
  .cell[data-color=""]::before {
    content: "\2014";
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px; font-weight: 500;
  }

  /* Down-week special cells */
  .cell.off-cell {
    background: transparent;
    background-image: none;
    border: 2px dashed #C6C1B0;
    box-shadow: none;
    color: var(--ink-dim);
    justify-content: center;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }
  .cell .big-line {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.3px;
    line-height: 1.05;
    text-transform: uppercase;
    text-align: center;
  }
  .cell .sub-line {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.85;
    margin-top: -2px;
  }
  .cell .shift-tag {
    position: absolute;
    top: 12px;
    right: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: rgba(26, 25, 21, 0.40);
    color: var(--on-cell);
    padding: 3px 8px 4px;
    border-radius: 3px;
  }

  /* Scheduled Down Day - full-cell treatment */
  .cell.down-cell {
    background: var(--panel);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 10px,
      rgba(26, 25, 21, 0.05) 10px 20px
    );
    color: var(--ink-sub);
    justify-content: center;
    align-items: center;
  }
  .cell.down-cell::before { content: none; }
  .cell.down-cell .down-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
  }
  .cell.down-cell .down-top {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .cell.down-cell .down-bottom {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.3px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .person {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }
  .person + .person {
    border-top: 1px solid rgba(255, 255, 255, 0.26);
  }
  .person .name {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.02;
    letter-spacing: -0.3px;
    text-align: center;
    text-transform: uppercase;
  }
  .person .prosser-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px 3px;
    background: rgba(26, 25, 21, 0.75);
    color: var(--on-cell);
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .cell.one-person .person .name { font-size: 34px; }

  /* ===== NEXT WEEK ===== */
  .nextweek {
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 22px;
    padding: 18px 24px 20px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 10px;
    height: 222px;
    flex-shrink: 0;
    box-shadow: var(--shadow-card);
  }
  .nextweek-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }
  .nextweek-head .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3.5px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .nextweek-head .range {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .next-flags {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nextweek-head .mini-switch {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 10px;
    background: var(--accent);
    color: var(--on-cell);
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .nextweek-head .mini-switch.hidden { display: none; }
  .nextweek-head .new-sched {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 10px;
    background: var(--ink);
    color: var(--surface);
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .nextweek-head .new-sched.hidden { display: none; }

  .mini-grid {
    display: grid;
    grid-template-columns: 84px repeat(7, 1fr);
    grid-template-rows: 22px minmax(44px, 1fr) minmax(44px, 1fr);
    gap: 8px;
    min-height: 0;
  }
  .mini-grid.legacy {
    grid-template-rows: 22px minmax(36px, 1fr) minmax(36px, 1fr) minmax(36px, 1fr);
  }
  .mini-cell {
    background: var(--panel);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
  }
  .mini-cell.mhead {
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .mini-cell.mrl {
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-sub);
  }
  .mini-cell[data-color] {
    color: var(--on-cell);
    padding: 4px 0;
    background-image: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 60%);
  }
  .mini-cell[data-color="blue"]   { background-color: var(--blue); }
  .mini-cell[data-color="orange"] { background-color: var(--orange); }
  .mini-cell[data-color="green"]  { background-color: var(--green); }
  .mini-cell[data-color="yellow"] { background-color: var(--yellow); }
  .mini-cell[data-color="purple"] { background-color: var(--purple); }
  .mini-cell[data-color="red"]    { background-color: var(--red); }
  .mini-cell[data-color=""]       { background-image: none; background: var(--panel); color: var(--ink-dim); }

  .mini-cell.down-mini {
    background: var(--panel);
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 6px,
      rgba(26, 25, 21, 0.06) 6px 12px
    );
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--ink-sub);
  }

  .mini-cell .ini-row {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .mini-cell .p-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    background: rgba(26, 25, 21, 0.82);
    color: var(--on-cell);
    padding: 2px 4px 2.5px;
    border-radius: 2px;
    line-height: 1;
  }
  .mini-cell.span-note {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }

  /* ============================================================
     "ALIVE" MOTION + 40-SECOND PROGRESS BAR  (cosmetic only)
     ============================================================ */
  @keyframes barFill   { from { width: 0%; }            to { width: 100%; } }
  @keyframes barBreathe {
    0%, 100% { height: 8px;  box-shadow: 0 -2px 10px rgba(26, 25, 21, 0); }
    50%      { height: 11px; box-shadow: 0 -3px 14px rgba(26, 25, 21, 0.26); }
  }
  @keyframes breathe   { 0%, 100% { transform: scale(1); }      50% { transform: scale(1.25); } }
  @keyframes floaty    { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes dnumPulse { 0%, 100% { transform: scale(1); }      50% { transform: scale(1.07); } }
  @keyframes todayGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210, 86, 47, 0), 0 14px 30px rgba(210, 86, 47, 0.26); }
    50%      { box-shadow: 0 0 0 5px rgba(210, 86, 47, 0.12), 0 18px 38px rgba(210, 86, 47, 0.36); }
  }
  @keyframes chipGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210, 86, 47, 0); }
    50%      { box-shadow: 0 0 16px 2px rgba(210, 86, 47, 0.45); }
  }

  /* 40s building progress bar pinned to the very bottom edge */
  .progress-track {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 8px;
    background: rgba(26, 25, 21, 0.10);
    overflow: hidden;
    z-index: 20;
    animation: barBreathe 2.6s ease-in-out infinite;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--ink);
    border-radius: 0 999px 999px 0;
    overflow: hidden;
    animation: barFill 40s linear infinite;
  }

  /* Pulsing switch alert + breathing dot */
  .switch-chip:not(.hidden) { animation: chipGlow 2.6s ease-in-out infinite; }
  .switch-chip .dot { animation: breathe 2.6s ease-in-out infinite; }

  /* Living "today" column */
  .day-head.today { animation: todayGlow 3s ease-in-out infinite; }
  .day-head.today .dnum { animation: dnumPulse 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="fit">
<div class="scaler" id="scaler">
<div class="stage">

  <header class="topbar">
    <h1 class="week-range" id="week-range">-</h1>
    <div class="switch-chip hidden" id="switch-chip">
      <span class="dot"></span>
      <span id="switch-text">-</span>
    </div>
  </header>

  <div class="oor-banner hidden" id="oor-banner"></div>

  <div class="grid" id="main-grid"></div>

  <section class="nextweek">
    <div class="nextweek-head">
      <span class="tag">Next Week</span>

/* === AUTO-FIT TO VIEWPORT === */
function fitToViewport() {
  const scaler = document.getElementById('scaler');
  if (!scaler) return;
  const vw = window.innerWidth  || document.documentElement.clientWidth  || screen.width  || 1920;
  const vh = window.innerHeight || document.documentElement.clientHeight || screen.height || 1080;
  if (vw < 100 || vh < 100) return;
  const scale = Math.min(vw / 1920, vh / 1080);
  const left = (vw - 1920 * scale) / 2;
  const top  = (vh - 1080 * scale) / 2;
  scaler.style.transform = "translate(" + left + "px, " + top + "px) scale(" + scale + ")";
}
fitToViewport();
window.addEventListener('resize', fitToViewport);
window.addEventListener('load', fitToViewport);
document.addEventListener('DOMContentLoaded', fitToViewport);
[100, 300, 600, 1000, 2000, 4000].forEach(function(ms) {
  setTimeout(fitToViewport, ms);
});

  "Brad P.": "green",   "Bob W.": "green",
  "Martin Z.": "yellow","Gabriel Z.": "yellow",
  "Jason W.": "purple",
  "Noe M.": "red"
};
const LEGACY_NAME_TO_INITIALS = {
  "Kyle F.": "KF",   "Alex G.": "AG",
  "Collin H.": "CH", "Leo G.": "LG",
  "Brad P.": "BP",   "Bob W.": "BW",
  "Martin Z.": "MZ", "Gabriel Z.": "GZ",
  "Jason W.": "JW",
  "Noe M.": "NM"
};
const LEGACY_TEAMMATE = {
  "Kyle F.":   "Alex G.",    "Alex G.":   "Kyle F.",
  "Collin H.": "Leo G.",     "Leo G.":    "Collin H.",
  "Brad P.":   "Bob W.",     "Bob W.":    "Brad P.",
  "Martin Z.": "Gabriel Z.", "Gabriel Z.":"Martin Z."
};

const DOW = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseISO(iso) { return new Date(iso + "T12:00:00"); }
function fmtDate(iso) {
  const d = parseISO(iso);
  return MONTHS[d.getMonth()] + " " + d.getDate();
}
function isoForLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function getEffectiveDate() {
  if (window.__TEST_DATE) return parseISO(window.__TEST_DATE);
  const params = new URLSearchParams(location.search);
  const d = params.get("date");
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) return parseISO(d);
  return new Date();
}
function findWeekIndex(iso, weeks) {
  for (let i = 0; i < weeks.length; i++) {
    if (iso >= weeks[i].start && iso <= weeks[i].end) return { index: i, mode: "current" };
  }
  if (iso < weeks[0].start) return { index: 0, mode: "before" };
  return { index: weeks.length - 1, mode: "after" };
}

/* A week is "legacy" when it carries a Day-Only shift row. */
function isLegacyWeek(week) {
  return !!(week && week.shifts && week.shifts.dayOnly);
}

/* Per-week rendering context: which maps, which rows, whether to expand. */
function contextFor(week) {
  if (isLegacyWeek(week)) {
    return {
      legacy: true,
      colors: LEGACY_NAME_TO_COLOR,
      initials: LEGACY_NAME_TO_INITIALS,
      teammate: LEGACY_TEAMMATE,
      rows: [
        { key: "dayOnly", label: "Day-Only" },
        { key: "day",     label: "Day"      },
        { key: "night",   label: "Night"    }
      ]
    };
  }
  return {
    legacy: false,
    colors: NAME_TO_COLOR,
    initials: NAME_TO_INITIALS,
    teammate: null,
    rows: [
      { key: "day",   label: "Day"   },
      { key: "night", label: "Night" }
    ]
  };
}

/* Legacy weeks auto-pair a single Prosser person with their old teammate. */
function expandCell(cell, ctx) {
  if (!cell || cell.length === 0) return [];
  if (!ctx.legacy || !ctx.teammate) return cell.slice();
  const names = new Set(cell.map(function(p){ return p.name; }));
  const out = cell.slice();
  for (const p of cell) {
    if (p.prosser) {
      const mate = ctx.teammate[p.name];
      if (mate && !names.has(mate)) { out.push({ name: mate }); names.add(mate); }
    }
  }
  return out;
}
function colorOf(cell, ctx) {
  if (!cell || cell.length === 0) return "";
  return ctx.colors[cell[0].name] || "";
}

function renderDownCell(isToday) {
  const div = document.createElement("div");
  div.className = "cell down-cell";
  if (isToday) div.classList.add("today-col");
  const label = document.createElement("div");
  label.className = "down-label";
  label.innerHTML = '<span class="down-top">Scheduled</span><span class="down-bottom">Down Day</span>';
  div.appendChild(label);
  return div;
}

function personRow(name, col, pi) {
  const row = document.createElement("div");
  row.className = "person";
  row.style.animation = "floaty " + (5.6 + ((col + pi) % 3) * 0.7).toFixed(2) +
    "s ease-in-out " + (-((col * 0.5) + pi * 0.9)).toFixed(2) + "s infinite";
  const n = document.createElement("div");
  n.className = "name";
  n.textContent = name;
  row.appendChild(n);
  return row;
}

function renderCell(rawCell, isToday, ctx, col) {
  const cell = expandCell(rawCell, ctx);
  const div = document.createElement("div");
  div.className = "cell";
  if (isToday) div.classList.add("today-col");
  const color = colorOf(cell, ctx);
  div.dataset.color = color;
  if (!cell || cell.length === 0) return div;
  if (cell.length === 1) div.classList.add("one-person");
  const c = (typeof col === "number") ? col : 0;
  let pi = 0;
  for (const person of cell) {
    const row = personRow(person.name, c, pi);
    if (ctx.legacy && person.prosser) {
      const pill = document.createElement("div");
      pill.className = "prosser-tag";
      pill.textContent = "Prosser";
      row.appendChild(pill);
    }
    div.appendChild(row);
    pi++;
  }
  return div;
}

function renderDownMiniCell() {
  const div = document.createElement("div");
  div.className = "mini-cell down-mini";
  div.textContent = "DOWN";
  return div;
}

function renderMiniCell(rawCell, ctx) {
  const cell = expandCell(rawCell, ctx);
  const div = document.createElement("div");
  div.className = "mini-cell";
  const color = colorOf(cell, ctx);
  if (!color) {
    div.textContent = "\u2013";
    return div;
  }
  div.dataset.color = color;
  for (const person of cell) {
    const row = document.createElement("div");
    row.className = "ini-row";
    const ini = document.createElement("span");
    ini.textContent = ctx.initials[person.name] || "";
    row.appendChild(ini);
    if (ctx.legacy && person.prosser) {
      const pm = document.createElement("span");
      pm.className = "p-mark";
      pm.textContent = "P";
      row.appendChild(pm);
    }
    div.appendChild(row);
  }
  return div;
}

function appendDayHeads(grid, week, todayCol) {
  const corner = document.createElement("div");
  corner.className = "corner";
  grid.appendChild(corner);
  for (let i = 0; i < 7; i++) {
    const d = new Date(parseISO(week.start).getTime() + i * 86400000);
    const head = document.createElement("div");
    head.className = "day-head" + (i === todayCol ? " today" : "");
    head.innerHTML = '<div class="dow">' + DOW[i] + '</div><div class="dnum">' + d.getDate() + '</div>';
    grid.appendChild(head);
  }
}

/* ===== SPECIAL "DOWNWEEK" RENDERING (Aug 24-30 2026) ===== */
function specialNamesCell(c, col) {
  const div = document.createElement("div");
  div.className = "cell";
  div.dataset.color = c.color;
  if (c.names.length === 1) div.classList.add("one-person");
  for (let pi = 0; pi < c.names.length; pi++) {
    div.appendChild(personRow(c.names[pi], col, pi));
  }
  if (c.tag) {
    const t = document.createElement("div");
    t.className = "shift-tag";
    t.textContent = c.tag;
    div.appendChild(t);
  }
  return div;
}

function renderSpecialGrid(grid, week, todayCol) {
  grid.className = "grid legacy";
  grid.innerHTML = "";
  appendDayHeads(grid, week, todayCol);
  for (const row of week.rows) {
    const rl = document.createElement("div");
    rl.className = "row-label";
    rl.dataset.dot = row.dot;
    let h = '<span class="rl-dot"></span><div class="rl-main">' + row.label + '</div>';
    if (row.sub) h += '<div class="rl-sub">' + row.sub + '</div>';
    rl.innerHTML = h;
    grid.appendChild(rl);
    let col = 0;
    for (const c of row.cells) {
      let div;
      if (c.off) {
        div = document.createElement("div");
        div.className = "cell off-cell";
        div.textContent = "Off";
      } else if (c.empty) {
        div = document.createElement("div");
        div.className = "cell off-cell";
        div.textContent = "\u2014";
      } else if (c.big) {
        div = document.createElement("div");
        div.className = "cell";
        div.dataset.color = c.color;
        const b = document.createElement("div");
        b.className = "big-line";
        b.textContent = c.big;
        div.appendChild(b);
        if (c.sub) {
          const s2 = document.createElement("div");
          s2.className = "sub-line";
          s2.textContent = c.sub;
          div.appendChild(s2);
        }
      } else {
        div = specialNamesCell(c, col);
      }
      if (c.span > 1) div.style.gridColumn = "span " + c.span;
      grid.appendChild(div);
      col += c.span || 1;
    }
  }
}

function renderSpecialMini(nxt, week) {
  nxt.className = "mini-grid legacy";
  const corner2 = document.createElement("div");
  corner2.className = "mini-cell mhead";
  nxt.appendChild(corner2);
  for (let i = 0; i < 7; i++) {
    const d = new Date(parseISO(week.start).getTime() + i * 86400000);
    const head = document.createElement("div");
    head.className = "mini-cell mhead";
    head.textContent = DOW[i] + " " + d.getDate();
    nxt.appendChild(head);
  }
  for (const row of week.rows) {
    const rl = document.createElement("div");
    rl.className = "mini-cell mrl";
    rl.textContent = row.short || row.label;
    nxt.appendChild(rl);
    for (const c of row.cells) {
      const div = document.createElement("div");
      div.className = "mini-cell";
      if (c.off) {
        div.classList.add("down-mini");
        div.textContent = "OFF";
      } else if (c.empty) {
        div.textContent = "\u2013";
      } else if (c.big) {
        div.dataset.color = c.color;
        div.classList.add("span-note");
        div.textContent = (c.mini || c.big).toUpperCase();
      } else {
        div.dataset.color = c.color;
        for (const name of c.names) {
          const r = document.createElement("div");
          r.className = "ini-row";
          const ini = document.createElement("span");
          ini.textContent = NAME_TO_INITIALS[name] || "";
          r.appendChild(ini);
          div.appendChild(r);
        }
      }
      if (c.span > 1) div.style.gridColumn = "span " + c.span;
      nxt.appendChild(div);
    }
  }
}

function render() {
  const now = getEffectiveDate();
  const iso = isoForLocalDate(now);

  const weeks = SCHEDULE.weeks;
  const loc = findWeekIndex(iso, weeks);
  const oor = document.getElementById("oor-banner");
  if (loc.mode === "before") {
    oor.classList.remove("hidden");
    oor.textContent = "Schedule starts " + fmtDate(weeks[0].start) + " - showing first week";
  } else if (loc.mode === "after") {
    oor.classList.remove("hidden");
    oor.textContent = "Schedule ended " + fmtDate(weeks[weeks.length - 1].end) + " - update required";
  } else {
    oor.classList.add("hidden");
  }

  const week = weeks[loc.index];
  const nextWeek = weeks[loc.index + 1] || null;
  const special = week.type === "downweek";
  const ctx = special ? null : contextFor(week);

  document.getElementById("week-range").textContent =
    fmtDate(week.start) + " \u2014 " + fmtDate(week.end);

  const chip = document.getElementById("switch-chip");
  const switchText = document.getElementById("switch-text");
  if (week.banner === "MECHANICS") {
    chip.classList.remove("hidden");
    switchText.textContent = "Mechanics Day/Night Switch This Week";
  } else if (week.chip) {
    chip.classList.remove("hidden");
    switchText.textContent = week.chip;
  } else {
    chip.classList.add("hidden");
  }

  let todayCol = -1;
  if (loc.mode === "current") {
    const start = parseISO(week.start);
    const diff = Math.round((now.setHours(12,0,0,0) - start.getTime()) / 86400000);
    if (diff >= 0 && diff <= 6) todayCol = diff;
  }

  const grid = document.getElementById("main-grid");
  if (special) {
    renderSpecialGrid(grid, week, todayCol);
  } else {
    grid.className = "grid" + (ctx.legacy ? " legacy" : "");
    grid.innerHTML = "";
    appendDayHeads(grid, week, todayCol);
    for (const s of ctx.rows) {
      const rl = document.createElement("div");
      rl.className = "row-label";
      rl.dataset.shift = s.key;
      rl.innerHTML = '<span class="rl-dot"></span><div class="rl-main">' + s.label + '</div>';
      grid.appendChild(rl);
      const row = week.shifts[s.key] || [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(parseISO(week.start).getTime() + i * 86400000);
        const dayIso = isoForLocalDate(d);
        if (DOWN_DAYS.has(dayIso)) {
          grid.appendChild(renderDownCell(i === todayCol));
        } else {
          grid.appendChild(renderCell(row[i] || [], i === todayCol, ctx, i));
        }
      }
    }
  }

  /* ===== Next-week panel ===== */
  const nxt = document.getElementById("next-grid");
  const nxtRange = document.getElementById("next-range");
  const nxtSwitch = document.getElementById("next-switch");
  const nxtNewSched = document.getElementById("next-newsched");
  nxt.innerHTML = "";

  if (nextWeek) {
    nxtRange.textContent = fmtDate(nextWeek.start) + " \u2014 " + fmtDate(nextWeek.end);

    if (nextWeek.banner === "MECHANICS") {
      nxtSwitch.classList.remove("hidden");
      nxtSwitch.textContent = "Mechanics Day/Night Switch Next Week";
    } else if (nextWeek.type === "downweek") {
      nxtSwitch.classList.remove("hidden");
      nxtSwitch.textContent = "Down Days Next Week";
    } else {
      nxtSwitch.classList.add("hidden");
    }

    const nctx = (nextWeek.type === "downweek") ? null : contextFor(nextWeek);

    if (ctx && ctx.legacy && nctx && !nctx.legacy) {
      nxtNewSched.classList.remove("hidden");
    } else {
      nxtNewSched.classList.add("hidden");
    }

    if (nextWeek.type === "downweek") {
      renderSpecialMini(nxt, nextWeek);
    } else {
      nxt.className = "mini-grid" + (nctx.legacy ? " legacy" : "");
      const corner2 = document.createElement("div");
      corner2.className = "mini-cell mhead";
      nxt.appendChild(corner2);
      for (let i = 0; i < 7; i++) {
        const d = new Date(parseISO(nextWeek.start).getTime() + i * 86400000);
        const head = document.createElement("div");
        head.className = "mini-cell mhead";
        head.textContent = DOW[i] + " " + d.getDate();
        nxt.appendChild(head);
      }
      for (const s of nctx.rows) {
        const rl = document.createElement("div");
        rl.className = "mini-cell mrl";
        rl.textContent = s.label;
        nxt.appendChild(rl);
        const row = nextWeek.shifts[s.key] || [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(parseISO(nextWeek.start).getTime() + i * 86400000);
          const dayIso = isoForLocalDate(d);
          if (DOWN_DAYS.has(dayIso)) {
            nxt.appendChild(renderDownMiniCell());
          } else {
            nxt.appendChild(renderMiniCell(row[i] || [], nctx));
          }
        }
      }
    }
  } else {
    nxtRange.textContent = "End of schedule";
    nxtSwitch.classList.add("hidden");
    nxtNewSched.classList.add("hidden");
    nxt.className = "mini-grid";
  }
}

render();
function scheduleMidnightRefresh() {
  const now = new Date();
  const t = new Date(now);
  t.setHours(24, 0, 30, 0);
  setTimeout(function() { render(); scheduleMidnightRefresh(); }, t - now);
}
scheduleMidnightRefresh();
setInterval(render, 60 * 60 * 1000);
</script>
